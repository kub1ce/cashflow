<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cash Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Segoe UI', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body class="flex h-screen w-full overflow-hidden font-sans bg-slate-50 text-slate-900">

  <!-- ══════════════════════════════════════════════════════
       SIDEBAR
  ══════════════════════════════════════════════════════ -->
  <aside class="w-60 bg-slate-900 text-white flex flex-col shrink-0">

    <!-- Логотип -->
    <div class="p-4 border-b border-slate-700">
      <h1 class="text-sm font-bold uppercase tracking-widest text-slate-100">
        Менеджер финансов
      </h1>
    </div>

    <!-- Навигация -->
    <nav class="flex-1 py-4 px-2 space-y-1">

      <div class="text-[10px] uppercase text-slate-500 font-bold px-3 mb-2">
        Обзор
      </div>

      <button
        id="nav-dashboard"
        onclick="switchView('dashboard')"
        class="nav-btn active w-full flex items-center space-x-3 px-3 py-2
               rounded text-sm font-medium transition-colors"
      >
        <!-- icon: LayoutDashboard -->
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>Таблица</span>
      </button>

      <button
        id="nav-settings"
        onclick="switchView('settings')"
        class="nav-btn w-full flex items-center space-x-3 px-3 py-2
               rounded text-sm font-medium transition-colors text-slate-300
               hover:bg-slate-800"
      >
        <!-- icon: Settings -->
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0
               002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0
               001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0
               00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724
               0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724
               1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724
               1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724
               1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608
               2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span>Настройки приложения</span>
      </button>

      <div class="text-[10px] uppercase text-slate-500 font-bold px-3 mt-6 mb-2">
        Инструменты
      </div>

      <button
        onclick="openReconcileModal()"
        class="nav-btn w-full flex items-center space-x-3 px-3 py-2
               rounded text-sm font-medium transition-colors text-slate-300
               hover:bg-slate-800"
      >
        <!-- icon: RefreshCw -->
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M23 4v6h-6M1 20v-6h6"/>
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0
               0020.49 15"/>
        </svg>
        <span>Сверка баланса</span>
      </button>

    </nav>
  </aside>

  <!-- ══════════════════════════════════════════════════════
       MAIN CONTENT
  ══════════════════════════════════════════════════════ -->
  <main class="flex-1 flex flex-col min-w-0">

    <!-- Header -->
    <header class="h-16 bg-white border-b border-slate-200 flex items-center
                   justify-between px-6 shrink-0">
      <h2 id="view-title"
          class="text-lg font-bold text-slate-800">
        Таблица планирования
      </h2>

      <!-- Date picker (только для таблицы) -->
      <div id="header-datepicker"
           class="flex items-center space-x-3">
        <span class="text-xs uppercase font-bold text-slate-500">
          Перейти к дате:
        </span>
        <input
          title="_"
          type="date"
          id="date-picker"
          class="text-sm border border-slate-300 rounded px-3 py-1.5
                 outline-none focus:ring-1 focus:ring-blue-500 bg-white
                 text-slate-700 font-mono shadow-sm"
        />
      </div>
    </header>

    <!-- Views -->
    <div class="flex-1 overflow-hidden flex flex-col">

      <!-- Dashboard view -->
      <div id="view-dashboard" class="flex-1 overflow-hidden flex flex-col">

        <!-- Лоадер -->
        <div id="loader"
             class="absolute inset-0 flex items-center justify-center
                    bg-slate-50 z-40">
          <div class="flex flex-col items-center gap-3">
            <div class="w-8 h-8 border-2 border-blue-500 border-t-transparent
                        rounded-full animate-spin"></div>
            <span class="text-sm text-slate-500">Загрузка данных...</span>
          </div>
        </div>

        <!-- Таблица -->
        <div class="flex-1 m-4 min-h-0 bg-white rounded-lg shadow-sm
                    border border-slate-200 flex flex-col overflow-hidden">

          <!-- Toolbar таблицы -->
          <div class="flex justify-end items-center p-3 border-b border-slate-200
                      shrink-0 bg-slate-50">
          </div>

          <!-- Скролл контейнер -->
          <div id="table-scroll-container"
               class="flex-1 overflow-auto">
            <table id="cashflow-table"
                   class="cashflow-table w-full text-sm font-sans
                          tabular-nums border-collapse bg-white">
              <thead id="table-head"
                     class="bg-slate-100 sticky top-0 z-20 shadow-sm">
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>

        </div>
      </div>

      <!-- Settings view -->
      <div id="view-settings"
           class="hidden flex-1 overflow-auto bg-slate-50 p-6">
        <div class="max-w-4xl mx-auto space-y-6" id="settings-content">
          <!-- Заполняется JS -->
        </div>
      </div>

    </div>
  </main>

  <!-- ══════════════════════════════════════════════════════
       МОДАЛКИ
  ══════════════════════════════════════════════════════ -->

  <!-- Дефицит (займ) -->
  <div id="deficit-modal"
       class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm
              items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden">
      <header class="px-6 py-4 border-b border-slate-100 flex items-center
                     justify-between">
        <h2 class="text-lg font-semibold text-slate-800">
          Дата возврата займа
        </h2>
        <button title="_" onclick="closeDeficitModal()"
                class="p-1 text-slate-400 hover:text-slate-600 rounded transition">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </header>
      <div class="p-6 space-y-4">
        <p class="text-sm text-slate-600 leading-relaxed">
          Покрытие разрыва в размере
          <strong id="deficit-amount-display" class="text-rose-600"></strong>.
          Укажите дату возврата:
        </p>
        <input
          title="_"
          type="date"
          id="deficit-return-date"
          class="w-full border border-slate-200 rounded p-3 text-sm
                 focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100
                  flex justify-end space-x-3">
        <button onclick="closeDeficitModal()"
                class="px-4 py-2 text-sm font-medium text-slate-700 bg-white
                       border border-slate-300 rounded hover:bg-slate-50 transition">
          Отмена
        </button>
        <button onclick="submitDeficit()"
                class="px-4 py-2 text-sm font-medium text-white bg-blue-600
                       rounded hover:bg-blue-700 transition">
          Подтвердить
        </button>
      </div>
    </div>
  </div>

  <!-- Сверка баланса -->
  <div id="reconcile-modal"
       class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm
              items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden
                flex flex-col max-h-[90vh]">
      <header class="px-6 py-4 border-b border-slate-100 flex items-center
                     justify-between shrink-0">
        <h2 class="text-lg font-semibold text-slate-800">Сверка баланса</h2>
        <button title="_" type="button" onclick="closeReconcileModal()"
                class="p-1 text-slate-400 hover:text-slate-600 rounded transition">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </header>
      <div class="p-6 overflow-y-auto space-y-5">

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">
            Дата сверки
          </label>
          <input
            title="_"
            type="date"
            id="reconcile-date"
            class="w-full max-w-[200px] border border-slate-300 rounded px-3
                   py-2 text-sm outline-none focus:ring-1 focus:ring-blue-500"
          />
        </div>

        <div class="p-4 bg-slate-50 rounded-lg border border-slate-100">
          <div class="text-xs font-medium text-slate-500 mb-1">
            Расчётный баланс (по таблице)
          </div>
          <div id="reconcile-calculated"
               class="text-2xl font-bold text-slate-800 font-mono">—</div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">
            Фактический остаток на счёте
          </label>
          <input
            type="number"
            id="reconcile-actual"
            placeholder="0"
            class="w-full border border-slate-300 rounded px-3 py-2 text-sm
                   text-right outline-none focus:ring-1 focus:ring-blue-500
                   font-mono"
          />
        </div>

        <div id="reconcile-diff-preview" class="hidden"></div>

      </div>
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100
                  flex justify-end space-x-3 shrink-0">
        <button onclick="closeReconcileModal()"
                class="px-4 py-2 text-sm font-medium text-slate-700 bg-white
                       border border-slate-300 rounded hover:bg-slate-50 transition">
          Отмена
        </button>
        <button onclick="submitReconcile()"
                class="px-4 py-2 text-sm font-medium text-white bg-blue-600
                       rounded hover:bg-blue-700 transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
          Уравнять
        </button>
      </div>
    </div>
  </div>

  <!-- AutoFill -->
  <div id="autofill-modal"
       class="fixed inset-0 bg-slate-900/50 items-center justify-center
              z-50 p-4 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex justify-between
                  items-center bg-slate-50">
        <h3 class="font-bold text-slate-800 text-sm">
          Автозаполнение:
          <span id="autofill-cat-name" class="text-blue-600"></span>
        </h3>
        <button onclick="closeAutofillModal()"
                class="text-slate-400 hover:text-slate-600 text-xl
                       font-bold leading-none">&times;</button>
      </div>
      <div class="p-5 space-y-4">
        <div>
          <label class="block tracking-wide uppercase text-slate-500
                        text-[10px] font-bold mb-1">
            Начальная дата
          </label>
          <input
            title="_"
            type="date"
            id="autofill-start-date"
            class="w-full border border-slate-200 rounded p-2 text-sm
                   outline-none focus:ring-1 focus:ring-blue-500 bg-slate-50"
          />
          <p id="autofill-week-hint"
             class="text-[10px] text-slate-500 mt-1 hidden"></p>
        </div>
        <div>
          <label class="block tracking-wide uppercase text-slate-500
                        text-[10px] font-bold mb-1">
            Количество недель
          </label>
          <input
            title="_"
            type="number"
            id="autofill-weeks"
            min="1" max="52"
            value="12"
            class="w-full border border-slate-200 rounded p-2 text-sm
                   outline-none focus:ring-1 focus:ring-blue-500 bg-slate-50"
          />
        </div>
        <div>
          <label class="block tracking-wide uppercase text-slate-500
                        text-[10px] font-bold mb-1">
            Сумма (План)
          </label>
          <input
            type="number"
            id="autofill-amount"
            placeholder="0.00"
            class="w-full border border-slate-200 rounded p-2 text-sm
                   outline-none focus:ring-1 focus:ring-blue-500 bg-slate-50
                   font-mono"
          />
        </div>
        <button
          onclick="submitAutofill()"
          class="w-full bg-blue-600 text-white font-bold text-xs uppercase
                 tracking-wide py-3 rounded hover:bg-blue-700 transition"
        >
          Заполнить
        </button>
      </div>
    </div>
  </div>

  <!-- Confirm dialog -->
  <div id="confirm-dialog"
       class="fixed inset-0 z-[60] bg-slate-900/40 backdrop-blur-sm
              items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-xs overflow-hidden">
      <div class="p-6 text-center">
        <div class="text-3xl mb-3">⚠️</div>
        <h3 id="confirm-title"
            class="font-semibold text-slate-800 text-sm mb-1"></h3>
        <p id="confirm-subtitle"
           class="text-xs text-slate-500"></p>
      </div>
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100
                  flex justify-center gap-3">
        <button id="confirm-cancel"
                class="px-4 py-2 text-sm font-medium text-slate-700 bg-white
                       border border-slate-300 rounded hover:bg-slate-50">
          Отмена
        </button>
        <button id="confirm-ok"
                class="px-4 py-2 text-sm font-medium text-white bg-red-500
                       rounded hover:bg-red-600">
          Удалить
        </button>
      </div>
    </div>
  </div>

</body>
<script src="js/main.js"></script>
</html>
