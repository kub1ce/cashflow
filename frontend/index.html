<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cash Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Segoe UI', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/animations.css">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('cashflow-theme');
    
        if (
          theme === 'dark' ||
          (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
    </script>
</head>

<body class="flex flex-col h-screen w-full overflow-hidden font-sans bg-slate-50 text-slate-900">

  <!-- TITLE BAR -->
  <div id="title-bar">
    <!-- Левая часть -->
    <div class="title-bar-left">
      <div class="title-bar-logo">
        <img src="./icon-256x256.ico" alt="" width="16" height="16"/>
      </div>
      <span class="title-bar-app-name">CashFlow</span>
    </div>

    <!-- Центр: название счёта -->
    <div class="title-bar-center" id="title-bar-account-name"></div>

    <!-- Правая часть -->
    <div class="title-bar-right">
      <!-- Кнопка Сегодня -->
      <button class="title-bar-today-btn" onclick="scrollToToday()" title="Перейти к текущей неделе">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="13" height="13">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0
              002-2V7a2 2 0 00-2-2H5a2 2 0
              00-2 2v12a2 2 0 002 2z"/>
        </svg>
        Сегодня
      </button>
      
      <!-- Тёмная тема -->
      <button class="title-bar-theme-btn" onclick="toggleTheme()" id="btn-theme" title="Переключить тему">
        <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <circle cx="12" cy="12" r="5"/>
          <path stroke-linecap="round" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" class="hidden">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>

      <!-- Свернуть -->
      <button class="win-btn" id="btn-minimize" title="Свернуть">
        <svg viewBox="0 0 10 10" fill="currentColor">
          <rect x="0" y="4.5" width="10" height="1"/>
        </svg>
      </button>

      <!-- Развернуть/восстановить -->
      <button class="win-btn" id="btn-maximize" title="Развернуть">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1">
          <rect x="0.5" y="0.5" width="9" height="9"/>
        </svg>
      </button>

      <!-- Закрыть -->
      <button class="win-btn close" id="btn-close" title="Закрыть">
        <svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1">
          <line x1="0" y1="0" x2="10" y2="10"/>
          <line x1="10" y1="0" x2="0" y2="10"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════
       SIDEBAR
  ══════════════════════════════════════════════════════ -->
  <div class="flex flex-1 min-h-0 overflow-hidden">
  <aside class="w-60 bg-slate-900 text-white flex flex-col shrink-0">

    <!-- Логотип -->
    <div class="p-4 border-b border-slate-700">
      <h1 class="text-sm font-bold uppercase tracking-widest text-slate-100">
        CashFlow
      </h1>
    </div>

    <!-- Навигация -->
    <nav class="flex-1 py-4 px-2 space-y-1">

      <div class="text-[10px] uppercase text-slate-500 font-bold px-3 mb-2">
        Обзор
      </div>

      <button
      id="nav-dashboard"
      class="nav-btn active w-full flex items-center space-x-3 px-3 py-2
            rounded text-sm font-medium transition-colors"
      >
        <!-- icon: LayoutDashboard -->
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>Таблица</span>
      </button>

      <button
        id="nav-settings"
        class="nav-btn w-full flex items-center space-x-3 px-3 py-2
               rounded text-sm font-medium transition-colors text-slate-300
               hover:bg-slate-800"
      >
        <!-- icon: Settings -->
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0
               002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0
               001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0
               00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724
               0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724
               1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724
               1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724
               1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608
               2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span>Параметры системы</span>
      </button>

      <div class="text-[10px] uppercase text-slate-500 font-bold px-3 mt-6 mb-2">
        Инструменты
      </div>

      <button
      id="btn-reconcile"
      class="nav-btn w-full flex items-center space-x-3 px-3 py-2
             rounded text-sm font-medium transition-colors text-slate-300
             hover:bg-slate-800"
    >
        <!-- icon: RefreshCw -->
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M23 4v6h-6M1 20v-6h6"/>
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0
               0020.49 15"/>
        </svg>
        <span>Сверка баланса</span>
      </button>

    </nav>
  </aside>

  <!-- ══════════════════════════════════════════════════════
       MAIN CONTENT
  ══════════════════════════════════════════════════════ -->
  <main class="flex-1 flex flex-col min-w-0">

    <!-- Header -->
    <header class="h-16 bg-white border-b border-slate-200 flex items-center
                   justify-between px-6 shrink-0">
      <h2 id="view-title"
          class="text-lg font-bold text-slate-800">
        Таблица планирования
      </h2>

      <!-- Date picker (только для таблицы) -->
      <div id="header-datepicker"
           class="flex items-center space-x-3">
        <span class="text-xs uppercase font-bold text-slate-500">
          Перейти к дате:
        </span>
        <input
          title="Перейти к определенной дате"
          type="date"
          id="date-picker"
          class="text-sm border border-slate-300 rounded px-3 py-1.5
                 outline-none focus:ring-1 focus:ring-blue-500 bg-white
                 text-slate-700 font-mono shadow-sm"
        />
      </div>
    </header>

    <!-- Views -->
    <div class="flex-1 overflow-hidden flex flex-col">

      <!-- Dashboard view -->
      <div id="view-dashboard"
            class="relative flex-1 overflow-hidden flex flex-col">

        <!-- Лоадер -->
        <div id="loader"
             class="absolute inset-0 flex items-center justify-center
                    bg-slate-50 z-40">
          <div class="flex flex-col items-center gap-3">
            <div class="w-8 h-8 border-2 border-blue-500 border-t-transparent
                        rounded-full animate-spin"></div>
            <span class="text-sm text-slate-500">Загрузка данных...</span>
          </div>
        </div>

        <!-- Таблица -->
        <div class="flex-1 min-h-0 bg-white rounded-lg shadow-sm
            border border-slate-200 flex flex-col overflow-hidden
            mr-4 mt-4 mb-4">

          <!-- Toolbar таблицы -->
          <div class="flex justify-end items-center p-3 border-b border-slate-200
                      shrink-0 bg-slate-50">
          </div>

          <!-- Скролл контейнер -->
          <div id="table-scroll-container"
               class="flex-1 overflow-auto">
            <table id="cashflow-table"
                   class="cashflow-table w-full text-sm font-sans
                          tabular-nums border-collapse bg-white">
              <thead id="table-head"
                     class="bg-slate-100 sticky top-0 z-20 shadow-sm">
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>

        </div>
      </div>

      <!-- Settings view -->
      <div id="view-settings"
           class="hidden flex-1 overflow-auto bg-slate-50 p-6">
        <div class="max-w-4xl mx-auto space-y-6" id="settings-content">
          <!-- Заполняется JS -->
        </div>
      </div>

    </div>
  </main>

  <!-- ══════════════════════════════════════════════════════
       МОДАЛКИ
  ══════════════════════════════════════════════════════ -->

  <!-- Дефицит (займ) -->
  <div id="deficit-modal"
       class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm
              items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden">
      <header class="px-6 py-4 border-b border-slate-100 flex items-center
                     justify-between">
        <h2 class="text-lg font-semibold text-slate-800">
          Дата возврата займа
        </h2>
        <button title="Дата возврата займа" onclick="closeDeficitModal()"
                class="p-1 text-slate-400 hover:text-slate-600 rounded transition">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </header>
            <div class="p-6 space-y-4">

        <!-- Сумма дефицита -->
        <div class="p-3 bg-rose-50 border border-rose-100 rounded-lg">
          <p class="text-xs text-rose-500 font-medium mb-0.5">Сумма дефицита</p>
          <p id="deficit-amount-display"
             class="text-xl font-bold text-rose-700 font-mono"></p>
        </div>

        <!-- Способ возврата -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-2 uppercase
                        tracking-wide">Способ возврата</label>
          <div class="flex gap-2">
            <button id="def-mode-single"
                    onclick="setDeficitMode('single')"
                    class="def-mode-btn active flex-1 py-2 rounded-lg border-2
                           text-sm font-semibold transition-all">
              Единовременно
            </button>
            <button id="def-mode-parts"
                    onclick="setDeficitMode('parts')"
                    class="def-mode-btn flex-1 py-2 rounded-lg border-2
                           text-sm font-semibold transition-all">
              По частям
            </button>
          </div>
        </div>

        <!-- Единовременно -->
        <div id="def-single-wrap" class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">
              Дата возврата
            </label>
            <input title="Дата возврата" type="date" id="deficit-return-date"
                   class="w-full border border-slate-200 rounded p-2.5 text-sm
                          focus:ring-2 focus:ring-blue-500 outline-none"/>
          </div>
        </div>

        <!-- По частям -->
        <div id="def-parts-wrap" class="hidden space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">
                Количество выплат
              </label>
              <input title="Количество выплат" type="number" id="def-parts-count"
                     min="2" max="52" value="4"
                     oninput="updateDeficitPartsPreview()"
                     class="w-full border border-slate-200 rounded p-2.5
                            text-sm outline-none focus:ring-2
                            focus:ring-blue-500 font-mono"/>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">
                Период выплат
              </label>
              <select title="Период выплат" id="def-parts-period"
                      onchange="updateDeficitPartsPreview()"
                      class="w-full border border-slate-200 rounded p-2.5
                             text-sm outline-none focus:ring-2
                             focus:ring-blue-500 bg-white">
                <option value="weeks">Недели</option>
                <option value="months">Месяцы</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">
              Дата первой выплаты
            </label>
            <input title="Дата первой выплаты" type="date" id="def-parts-start-date"
                   oninput="updateDeficitPartsPreview()"
                   class="w-full border border-slate-200 rounded p-2.5
                          text-sm outline-none focus:ring-2
                          focus:ring-blue-500"/>
          </div>

          <!-- Авто-расчёт суммы -->
          <div id="def-parts-preview"
               class="hidden p-3 bg-blue-50 border border-blue-100
                      rounded-lg text-xs text-blue-700">
          </div>
        </div>

      </div>
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100
                  flex justify-end space-x-3">
        <button onclick="closeDeficitModal()"
                class="px-4 py-2 text-sm font-medium text-slate-700 bg-white
                       border border-slate-300 rounded hover:bg-slate-50 transition">
          Отмена
        </button>
        <button onclick="submitDeficit()"
                class="px-4 py-2 text-sm font-medium text-white bg-blue-600
                       rounded hover:bg-blue-700 transition">
          Подтвердить
        </button>
      </div>
    </div>
  </div>

  <!-- Сверка баланса -->
  <div id="reconcile-modal"
       class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm
              items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden
                flex flex-col max-h-[90vh]">
      <header class="px-6 py-4 border-b border-slate-100 flex items-center
                     justify-between shrink-0">
        <h2 class="text-lg font-semibold text-slate-800">Сверка баланса</h2>
        <button title="Сверить баланс" type="button" onclick="closeReconcileModal()"
                class="p-1 text-slate-400 hover:text-slate-600 rounded transition">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </header>
      <div class="p-6 overflow-y-auto space-y-5">

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">
            Дата сверки
          </label>
          <input
            title="Дата сверки баланса"
            type="date"
            id="reconcile-date"
            onchange="updateReconcileCalculated(this.value)"
            class="w-full max-w-[200px] border border-slate-300 rounded px-3
                   py-2 text-sm outline-none focus:ring-1 focus:ring-blue-500"
          />
        </div>

        <div class="p-4 bg-slate-50 rounded-lg border border-slate-100">
          <div class="text-xs font-medium text-slate-500 mb-1">
            Расчётный баланс (по таблице)
          </div>
          <div id="reconcile-calculated"
               class="text-2xl font-bold text-slate-800 font-mono">—</div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">
            Фактический остаток на счёте
          </label>
          <input
            type="number"
            id="reconcile-actual"
            placeholder="0"
            step="0.01"
            inputmode="decimal"
            min="0"
            class="w-full border border-slate-300 rounded px-3 py-2 text-sm
                   text-right outline-none focus:ring-1 focus:ring-blue-500
                   font-mono"
          />
        </div>

        <div id="reconcile-diff-preview" class="hidden"></div>

      </div>
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100
                  flex justify-end space-x-3 shrink-0">
        <button onclick="closeReconcileModal()"
                class="px-4 py-2 text-sm font-medium text-slate-700 bg-white
                       border border-slate-300 rounded hover:bg-slate-50 transition">
          Отмена
        </button>
        <button onclick="submitReconcile()"
                class="px-4 py-2 text-sm font-medium text-white bg-blue-600
                       rounded hover:bg-blue-700 transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
          Уравнять
        </button>
      </div>
    </div>
  </div>

  <!-- AutoFill -->
  <div id="autofill-modal"
       class="fixed inset-0 bg-slate-900/50 items-center justify-center
              z-50 p-4 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex justify-between
                  items-center bg-slate-50">
        <h3 class="font-bold text-slate-800 text-sm">
          Автозаполнение:
          <span id="autofill-cat-name" class="text-blue-600"></span>
        </h3>
        <button onclick="closeAutofillModal()"
                class="text-slate-400 hover:text-slate-600 text-xl
                       font-bold leading-none">&times;</button>
      </div>
            <div class="p-5 space-y-4">

        <!-- Режим: недели / месяцы -->
        <div>
          <label class="block tracking-wide uppercase text-slate-500
                        text-[10px] font-bold mb-2">Период</label>
          <div class="flex gap-2">
            <button id="af-mode-weeks"
                    onclick="setAutofillMode('weeks')"
                    class="af-mode-btn active flex-1 py-2 rounded-lg border-2
                           text-sm font-semibold transition-all">
                    На недели
            </button>
            <button id="af-mode-months"
                    onclick="setAutofillMode('months')"
                    class="af-mode-btn flex-1 py-2 rounded-lg border-2
                           text-sm font-semibold transition-all">
                    На месяцы
            </button>
          </div>
        </div>

        <!-- Начальная дата -->
        <div>
          <label class="block tracking-wide uppercase text-slate-500
                        text-[10px] font-bold mb-1">
            Начальная дата
          </label>
          <input title="Начальная дата" type="date" id="autofill-start-date"
                 class="w-full border border-slate-200 rounded p-2 text-sm
                        outline-none focus:ring-1 focus:ring-blue-500 bg-slate-50"/>
          <p id="autofill-week-hint"
             class="text-[10px] text-slate-500 mt-1 hidden"></p>
        </div>

        <!-- День месяца (только для режима месяцев) -->
        <div id="af-day-of-month-wrap" class="hidden">
          <label class="block tracking-wide uppercase text-slate-500
                        text-[10px] font-bold mb-1">
            День месяца (день выплаты)
          </label>
          <input title="День месяца" type="number" id="autofill-day-of-month"
                 min="1" max="31" value="1"
                 class="w-full border border-slate-200 rounded p-2 text-sm
                        outline-none focus:ring-1 focus:ring-blue-500 bg-slate-50"/>
          <p class="text-[10px] text-slate-400 mt-1">
            Если дня нет в месяце — берётся последний день
          </p>
        </div>

        <!-- Количество -->
        <div>
          <label class="block tracking-wide uppercase text-slate-500
                        text-[10px] font-bold mb-1">
            <span id="af-count-label">Количество недель</span>
          </label>
          <input title="Количество недель" type="number" id="autofill-weeks"
                 min="1" max="52" value="12"
                 class="w-full border border-slate-200 rounded p-2 text-sm
                        outline-none focus:ring-1 focus:ring-blue-500 bg-slate-50"/>
        </div>

        <!-- Сумма -->
        <div>
          <label class="block tracking-wide uppercase text-slate-500
                        text-[10px] font-bold mb-1">Сумма (план)</label>
                        <input type="number"
                        id="autofill-amount"
                        step="0.01"
                        inputmode="decimal"
                        placeholder="0.00"
                        class="w-full border border-slate-200 rounded p-2 text-sm
                                outline-none focus:ring-1 focus:ring-blue-500
                                bg-slate-50 font-mono"/>
        </div>

        <!-- Превью -->
        <div id="af-preview"
             class="hidden text-xs text-slate-600 bg-slate-50
                    border border-slate-200 rounded-lg p-3">
        </div>

        <button
                class="w-full bg-blue-600 text-white font-bold text-xs
                       uppercase tracking-wide py-3 rounded
                       hover:bg-blue-700 transition">
          Заполнить
        </button>
      </div>
    </div>
  </div>

  <!-- Confirm dialog -->
<div id="confirm-dialog"
     class="fixed inset-0 z-[60] bg-slate-900/40 backdrop-blur-sm
            items-center justify-center p-4 hidden">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-xs overflow-hidden">
    <div class="p-6 text-center">
      <div class="text-3xl mb-3">⚠️</div>
      <h3 id="confirm-title"
          class="font-semibold text-slate-800 text-sm mb-1"></h3>
      <p id="confirm-subtitle"
         class="text-xs text-slate-500"></p>
    </div>
    <div class="px-6 py-4 bg-slate-50 border-t border-slate-100
                flex justify-center gap-3">
      <button id="confirm-cancel"
              class="px-4 py-2 text-sm font-medium text-slate-700 bg-white
                     border border-slate-300 rounded hover:bg-slate-50">
        Отмена
      </button>
      <button id="confirm-ok"
              class="px-4 py-2 text-sm font-medium text-white bg-red-500
                     rounded hover:bg-red-600">
        Удалить
      </button>
    </div>
  </div>
</div>
</div> <!-- /.flex.flex-1 -->
</body>
<script src="js/main.js"></script>
<script src="js/animations.js"></script> 
</html>
